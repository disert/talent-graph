server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ★ 上传体积上限必须写在 server 级（最外层）：
    #   client_max_body_size 是按「实际匹配到的 location」继承的，nginx 默认只有 1m。
    #   `/talent-graph/backend/` 这条 location 只做 rewrite，并不会继承 `/api/` 里写的
    #   那一份 —— 于是只要请求经 20022（直连，或反代把 /talent-graph/backend/... 透传过来），
    #   上传稍大的附件就会被这里按默认 1m 挡掉，返回 nginx 原生 413 页面，后端日志无记录。
    #   本机实测同一份配置：/api/ 传 3MB 正常（走到业务校验 400），而
    #   /talent-graph/backend/api/... 传 0.9MB 通过、1.5MB 就 413。
    client_max_body_size 100m;
    client_body_timeout 300s;      # 大文件慢速上传别中途掐断（默认 60s）

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        client_max_body_size 100m;     # 显式重复一遍，防止 server 级那行被误删
        proxy_read_timeout 300s;
    }

    # ---------- 二级路径访问 ----------
    # 前端若按 VITE_BASE_PATH=/talent-graph/frontend/ 构建，资源与接口请求都会带这个前缀；
    # 上游反向代理（例：10.137.74.32）用 `proxy_pass http://44.149:20022;`（不带尾斜杠）时
    # 会把前缀原样透传过来，这里统一剥掉，走下面的普通规则即可。
    # 剥掉后两种访问方式都能用：
    #   直连  http://<后端机>:20022/            （资源走 /assets、接口走 /api）
    #   反代  https://<代理机>/talent-graph/frontend/  与  /talent-graph/backend/api/...
    location /talent-graph/frontend/ {
        client_max_body_size 100m;     # 见上面 server 级说明：这条 location 不会继承 /api/ 的设置
        rewrite ^/talent-graph/frontend/(.*)$ /$1 last;
    }

    location /talent-graph/backend/ {
        client_max_body_size 100m;     # 上传简历/Excel 走的就是这条，默认 1m 会 413
        rewrite ^/talent-graph/backend/(.*)$ /$1 last;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
