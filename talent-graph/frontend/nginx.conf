server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        client_max_body_size 100m;
        proxy_read_timeout 300s;
    }

    # ---------- 二级路径访问 ----------
    # 前端若按 VITE_BASE_PATH=/talent-graph/frontend/ 构建，资源与接口请求都会带这个前缀；
    # 上游反向代理（例：10.137.74.32）用 `proxy_pass http://44.149:20022;`（不带尾斜杠）时
    # 会把前缀原样透传过来，这里统一剥掉，走下面的普通规则即可。
    # 剥掉后两种访问方式都能用：
    #   直连  http://<后端机>:20022/            （资源走 /assets、接口走 /api）
    #   反代  https://<代理机>/talent-graph/frontend/  与  /talent-graph/backend/api/...
    location /talent-graph/frontend/ {
        rewrite ^/talent-graph/frontend/(.*)$ /$1 last;
    }

    location /talent-graph/backend/ {
        rewrite ^/talent-graph/backend/(.*)$ /$1 last;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
