services:
  db:
    image: pgvector/pgvector:pg16
    container_name: talent-graph-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: talent_graph
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: talent-graph-backend:latest        # 显式命名，便于 docker save/load 与推私有仓库
    container_name: talent-graph-backend
    # 配置已烘焙进镜像（backend/.env → /app/.env），故不再挂 env_file；
    # 此处只覆盖「容器间通信」这一项：镜像内 .env 写的是 localhost，容器里必须走 db 服务名
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/talent_graph
    ports:
      - "20021:8000"        # 宿主机 20021 → 容器内 8000
    volumes:
      - upload_data:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    # 如需本地 BGE-M3 / PaddleOCR 用 GPU，取消下面注释（需 NVIDIA Container Toolkit）
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      # 二级路径部署（经反向代理挂在 /talent-graph/frontend/）时必须传这两个参数，
      # 否则浏览器会去代理机的 /assets/xxx.js 取资源（404）→ 页面 #root 为空；
      # 若前端是直接暴露 20022 端口访问，把 args 整段删掉用默认值（/ 和 /api）即可。
      args:
        VITE_BASE_PATH: /talent-graph/frontend/
        VITE_API_BASE: /talent-graph/backend/api
    image: talent-graph-frontend:latest
    container_name: talent-graph-frontend
    ports:
      - "20022:80"          # 宿主机 20022 → 容器内 80
    depends_on:
      - backend

volumes:
  pgdata:
  upload_data:
